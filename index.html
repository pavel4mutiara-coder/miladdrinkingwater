<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milad Water" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Milad Drinking Water Management</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #3b82f6; font-family: sans-serif;">
        <div style="text-align: center;">
          <h2 style="margin-bottom: 10px;">Milad Water Management</h2>
          <p style="color: #94a3b8; font-size: 14px;">Initializing application...</p>
        </div>
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Fatal Early Error:', msg, error);
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;"><h1>App Initialization Failed</h1><p>' + msg + '</p><p>Check console for details.</p></div>';
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>

          }).catch(err => {
            console.log('SW reg error:', err);
          });
        });
      }
      */
    </script>
  </body>
</html>
