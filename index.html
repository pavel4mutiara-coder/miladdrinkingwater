<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Milad Water" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Milad Drinking Water Management</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #3b82f6; font-family: sans-serif;">
        <div style="text-align: center;">
          <h2 style="margin-bottom: 10px;">Milad Water Management</h2>
          <p style="color: #94a3b8; font-size: 14px;">Initializing application...</p>
        </div>
      </div>
    </div>
    <script>
      // Force unregister all service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Unregistered service worker to prevent white screen issues');
          }
        });
      }

      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Fatal Early Error:', msg, error);
        
        // Auto-recovery for chunk load errors or fatal init errors
        if (msg.includes('ChunkLoadError') || msg.includes('Loading chunk')) {
          console.warn('Chunk load error detected. Attempting hard reload...');
          const lastReload = localStorage.getItem('last_auto_reload');
          const now = Date.now();
          // Prevent infinite reload loops (only reload if last reload was > 5s ago)
          if (!lastReload || (now - parseInt(lastReload)) > 5000) {
            localStorage.setItem('last_auto_reload', now.toString());
            window.location.reload(true);
            return true;
          }
        }

        const root = document.getElementById('root');
        const loading = document.getElementById('initial-loading');
        if (loading) {
          loading.innerHTML = '<div style="padding: 20px; color: #ef4444; font-family: sans-serif; text-align: center;">' +
            '<h1 style="font-size: 20px; margin-bottom: 8px;">App Recovery Required</h1>' +
            '<p style="font-size: 14px; margin-bottom: 16px;">' + msg + '</p>' +
            '<button onclick="localStorage.clear(); window.location.reload(true);" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Reset & Reload App</button>' +
            '</div>';
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
